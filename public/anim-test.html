<div class="civi-auth-anim-wrap">
  <div class="caa-center">
    <div class="caa-core"></div>
    <div class="caa-ring caa-ring-1"></div>
    <div class="caa-ring caa-ring-2"></div>
    
    <!-- Nodes orbiting -->
    <div class="caa-node-orbit orbit-1">
      <div class="caa-node n1">
        <i class="fas fa-user"></i>
      </div>
    </div>
    
    <div class="caa-node-orbit orbit-2">
      <div class="caa-node n2">
        <i class="fas fa-file-signature"></i>
      </div>
    </div>
    
    <div class="caa-node-orbit orbit-3">
      <div class="caa-node n3">
        <i class="fas fa-shield-halved"></i>
      </div>
    </div>

    <!-- Floating particles -->
    <div class="caa-particles">
      <div class="caa-particle p1"></div>
      <div class="caa-particle p2"></div>
      <div class="caa-particle p3"></div>
      <div class="caa-particle p4"></div>
      <div class="caa-particle p5"></div>
    </div>
  </div>
</div>
